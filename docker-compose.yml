# Dev stack: infrastructure + (optionally) app. Host ports are deliberately unusual
# to avoid clashing with other projects on the same machine.
name: ${COMPOSE_PROJECT_NAME:-rento-dev}
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rento
      POSTGRES_PASSWORD: rento
      POSTGRES_DB: rento
    ports: ["127.0.0.1:5441:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rento -d rento"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6391:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-rentominio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-rentominio-dev-secret}
    ports: ["127.0.0.1:9110:9000", "127.0.0.1:9111:9001"]
    volumes: [miniodata:/data]
  api:
    build: {context: ./backend}
    profiles: ["app"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rento:rento@postgres:5432/rento
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
    ports: ["127.0.0.1:8010:8000"]
volumes:
  pgdata:
  miniodata:
